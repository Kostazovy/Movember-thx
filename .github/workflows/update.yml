name: Aktualizace a nasazení

on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Nainstalovat prohlížeč
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Načíst profil a upravit index.html
        run: node scripts/update.mjs
      - name: Uložit změnu
        run: |
          if ! git diff --quiet index.html; then
            git config user.name "movember-bot"
            git config user.email "movember-bot@users.noreply.github.com"
            git add index.html
            git commit -m "Aktualizace příspěvků"
            git push
          fi
      - name: Připravit web
        run: mkdir _site && cp index.html _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
